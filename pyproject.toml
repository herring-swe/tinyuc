# Tooling configuration for repository-level Python utilities.
# Scoped to tools/ and excludes tools/ucparser, which has its own pyproject.toml.

[tool.ruff]
target-version = "py310"
line-length = 100
include = ["tools/**/*.py"]
exclude = ["tools/py_c_preprocessor"]

force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
files = ["tools"]
warn_unused_configs = true
